<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ashen Realms V0.10.9</title><style>*{box-sizing:border-box}body{margin:0;background:#13101e;color:#eee;font:16px system-ui}header{text-align:center;padding:18px;letter-spacing:3px;color:#c7a9ff}#view{height:60dvh;min-height:280px;position:relative;touch-action:none}canvas{display:block}main{max-width:650px;margin:auto;padding:16px}button{background:#332647;color:white;border:1px solid #8065aa;border-radius:10px;padding:12px;flex:1;font:inherit}button.active{background:#67449d}.row{display:flex;gap:8px;margin-bottom:12px}#status{color:#c7a9ff}small{color:#b7adc8}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}input{max-width:55%;background:#332647;color:white;border:1px solid #8065aa;border-radius:8px;padding:8px;font:inherit}input[type=color]{width:65px;height:38px}input[type=range]{accent-color:#a88be0;width:55%}html,body{height:100%;overflow:hidden}body{height:100dvh;display:flex;flex-direction:column}header{flex:none;padding:12px 8px}#view{flex:none;height:43dvh;min-height:0;width:100%;overflow:hidden}main{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(20px,env(safe-area-inset-bottom))}canvas{width:100%;height:100%}@media(max-height:450px){#view{height:35dvh}header{padding:6px}}select{background:#332647;color:white;border:1px solid #8065aa;border-radius:8px;padding:8px;font:inherit}</style><script type=importmap>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"}}</script></head><body><header>ASHEN REALMS · V0.10.9</header><div id=view></div><main><div class=row><button id=male>Male</button><button id=female>Female</button></div><div class=row><button id=full>Full body</button><button id=face>Face close-up</button></div><label>Idle pose <select id=pose><option value=neutral>Neutral</option><option value=crossed>Arms crossed</option><option value=pockets>Hands in pockets</option><option value=ready>Battle-ready</option></select></label><label>Name <input id=hname maxlength=32 value="Hunter"></label><label>Height <input id=height type=range min=85 max=115 value=100></label><label>Hair colour <input id=hair type=color value="#ffffff"></label><div class=row><button id=whitehair>White hair</button><button id=originalhair>Original hair</button></div><label>Eye colour <input id=eyes type=color value="#ffffff"></label><label>Skin tone <select id=skin><option value="#ffffff">Original</option><option value="#ffe8d8">Fair</option><option value="#e9c2a0">Warm</option><option value="#c58f68">Tan</option><option value="#96664c">Brown</option><option value="#684331">Deep</option></select></label><label>Outfit tint <input id=outfit type=color value="#ffffff"></label><div class=row><button id=reset>Reset appearance</button><button id=save>Save hunter</button></div><div id=status role=status>Loading renderer…</div><p><small>Anime asset preview · Drag to rotate, pinch to zoom. Hair and iris colours use luminance-preserving texture recolouring; skin and outfit use tints. Body sculpting and equipment remain pending.</small></p></main><script type=module>
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const $=id=>document.getElementById(id), view=$('view'), status=$('status');const scene=new T.Scene();scene.background=new T.Color(0x181324);const camera=new T.PerspectiveCamera(35,1,.01,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=.25;controls.maxDistance=8;controls.minPolarAngle=.35;controls.maxPolarAngle=Math.PI*.49;scene.add(new T.HemisphereLight(0xffffff,0x74658e,1.05));const light=new T.DirectionalLight(0xffffff,1.15);light.position.set(3,5,4);scene.add(light);const rim=new T.DirectionalLight(0xb79aff,.65);rim.position.set(-3,2,-3);scene.add(rim);const edge=new T.DirectionalLight(0x9a70ff,.8);edge.position.set(3,2,-4);scene.add(edge);const floor=new T.Mesh(new T.CylinderGeometry(1,1,.05,64),new T.MeshStandardMaterial({color:0x39304c}));floor.position.y=-.025;scene.add(floor);const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));let vrm=null,bounds=null,seq=0,mode='full';const clock=new T.Clock();let sexNow='Male';const fields=['hname','height','hair','eyes','skin','outfit'];let originalHair=true;let saved;try{saved=JSON.parse(localStorage.getItem('ashen-anime-v102')||'null')}catch{};if(saved)originalHair=saved.originalHair??(saved.hair==='#ffffff');if(saved)for(const k of fields)if(typeof saved[k]==='string'){$(k).value=saved[k];if(k==='skin'&&!$(k).value){$(k).add(new Option('Previous custom tone',saved[k]));$(k).value=saved[k];}}const recolours=new WeakMap();
const pose=$('pose');let poseChoice=saved?.pose||'auto';
function syncPose(){pose.querySelector('[value=pockets]').disabled=sexNow==='Female';pose.value=poseChoice==='auto'?(sexNow==='Female'?'crossed':'pockets'):poseChoice;if(!pose.value|| (sexNow==='Female'&&pose.value==='pockets'))pose.value='crossed';}
pose.onchange=()=>{poseChoice=pose.value};
function idle(t){const b=n=>vrm.humanoid.getNormalizedBoneNode(n);const set=(n,x=0,y=0,z=0)=>{const o=b(n);if(o)o.rotation.set(x,y,z)};const breath=Math.sin(t*1.6),p=pose.value;
set('head',0,p==='neutral'?0:-.07,p==='crossed'?.045:0);set('chest',breath*.008);
const pos=o=>o.getWorldPosition(new T.Vector3());
function aim(bone,child,dir){if(!bone||!child)return;bone.parent.updateWorldMatrix(true,false);const local=dir.clone().normalize().applyQuaternion(bone.parent.getWorldQuaternion(new T.Quaternion()).invert());bone.quaternion.setFromUnitVectors(child.position.clone().normalize(),local);bone.updateWorldMatrix(true,true);}
// Analytic two-bone IK: wrist target and elbow pole in world space.
function solve(a,f,h,target,pole){const origin=pos(a), l1=pos(f).distanceTo(origin),l2=pos(h).distanceTo(pos(f));const axis=target.clone().sub(origin);const d=T.MathUtils.clamp(axis.length(),Math.abs(l1-l2)+.0001,l1+l2-.0001);axis.normalize();const bend=pole.clone().sub(origin);bend.addScaledVector(axis,-bend.dot(axis)).normalize();const along=(l1*l1-l2*l2+d*d)/(2*d);const elbow=origin.clone().addScaledVector(axis,along).addScaledVector(bend,Math.sqrt(Math.max(0,l1*l1-along*along)));const wrist=origin.clone().addScaledVector(axis,d);aim(a,f,elbow.sub(origin));aim(f,h,wrist.sub(pos(f)));}
for(const side of ['left','right']){const a=b(side+'UpperArm'),f=b(side+'LowerArm'),h=b(side+'Hand');if(!a||!f||!h)continue;set(side+'UpperArm');set(side+'LowerArm');set(side+'Hand');a.updateWorldMatrix(true,true);const center=pos(b('chest')||b('spine'));const shoulder=pos(a);const sign=shoulder.x>=center.x?1:-1;const unit=pos(f).distanceTo(shoulder);const middle=b(side+'MiddleProximal');
if(p==='crossed'||p==='pockets'){const crossed=p==='crossed';const hips=pos(b('hips'));const target=crossed?new T.Vector3(center.x-sign*unit*.25,center.y+(side==='left'?.12:.28)*unit,center.z+unit*(side==='left'?.85:1.02)):new T.Vector3(hips.x+sign*unit*.55,hips.y+unit*.10,hips.z+unit*.59);const pole=new T.Vector3(center.x+sign*unit*1.15,shoulder.y-unit*1.4,center.z+unit*.20);solve(a,f,h,target,pole);if(middle)aim(h,middle,crossed?new T.Vector3(-sign,.12,.04):new T.Vector3(-sign*.75,-.65,-.12));}else{let upper,lower;if(p==='ready'){upper=new T.Vector3(sign*.35,-.9,.16);lower=new T.Vector3(-sign*.12,-.85,.45);}else{const angle=sexNow==='Female'?1.08:1.30;upper=new T.Vector3(sign*Math.cos(angle),-Math.sin(angle),0);lower=upper.clone();}aim(a,f,upper);aim(f,h,lower);}}

}

function recolour(m,hex){
 let r=recolours.get(m);if(!r){const original=m.map;if(!original?.image)return false;const c=document.createElement('canvas');c.width=original.image.width;c.height=original.image.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(original.image,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height);const tex=new T.CanvasTexture(c);tex.flipY=original.flipY;tex.colorSpace=original.colorSpace;tex.wrapS=original.wrapS;tex.wrapT=original.wrapT;tex.repeat.copy(original.repeat);tex.offset.copy(original.offset);tex.rotation=original.rotation;tex.center.copy(original.center);r={original,c,ctx,pixels,tex,last:null,shade:m.shadeMultiplyTexture};recolours.set(m,r);}
 if(r.last===hex)return true;r.last=hex;if(hex==='original'||(hex==='#ffffff' && m.name.includes('EyeIris'))){m.map=r.original;if('shadeMultiplyTexture' in m)m.shadeMultiplyTexture=r.shade;m.needsUpdate=true;return true;}
 const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));const out=r.ctx.createImageData(r.c.width,r.c.height);const src=r.pixels.data;for(let i=0;i<src.length;i+=4){const l=(src[i]*.2126+src[i+1]*.7152+src[i+2]*.0722)/255;const v=Math.min(1,.48+Math.sqrt(l)*1.05);for(let k=0;k<3;k++)out.data[i+k]=Math.round(rgb[k]*v);out.data[i+3]=src[i+3];}r.ctx.putImageData(out,0,0);r.tex.needsUpdate=true;m.map=r.tex;if('shadeMultiplyTexture' in m)m.shadeMultiplyTexture=r.tex;m.needsUpdate=true;return true;
}
function appearance(){if(!vrm)return;vrm.scene.scale.setScalar(Number($('height').value)/100);const seen=new Set();vrm.scene.traverse(o=>{if(!o.isMesh)return;for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(!m?.color||seen.has(m))continue;seen.add(m);const n=m.name;const k=/_HAIR/i.test(n)?'hair':/EyeIris/i.test(n)?'eyes':/_SKIN/i.test(n)?'skin':/_CLOTH/i.test(n)?'outfit':null;if(!k)continue;if(!m.userData.originalTint)m.userData.originalTint=m.color.clone();m.color.copy(m.userData.originalTint);if(k==='hair'||k==='eyes'){if(!recolour(m,k==='hair'&&originalHair?'original':$(k).value))m.color.multiply(new T.Color($(k).value));}else m.color.multiply(new T.Color($(k).value));}});vrm.scene.updateMatrixWorld(true);bounds=new T.Box3().setFromObject(vrm.scene);}
for(const k of fields)$(k).addEventListener('input',()=>{if(k==='hair')originalHair=false;appearance();if(k==='hair'||k==='eyes'){if(mode!=='face'){mode='face';frame()}}else if(k==='height')frame()});
$('whitehair').onclick=()=>{originalHair=false;$('hair').value='#ffffff';appearance();mode='face';frame()};$('originalhair').onclick=()=>{originalHair=true;appearance();mode='face';frame()};$('reset').onclick=()=>{poseChoice='auto';syncPose();originalHair=true;for(const k of fields)$(k).value=k==='hname'?'Hunter':k==='height'?'100':'#ffffff';appearance();frame()};$('save').onclick=()=>{try{localStorage.setItem('ashen-anime-v102',JSON.stringify({sex:sexNow,originalHair,pose:poseChoice,...Object.fromEntries(fields.map(k=>[k,$(k).value]))}));status.textContent='Hunter saved on this device.'}catch(e){status.textContent='Save failed: '+e.message}};function frame(){if(!bounds)return;const h=bounds.max.y-bounds.min.y;const y=mode==='face'?bounds.max.y-h*.12:bounds.min.y+h*.5;controls.target.set(0,y,0);const dist=mode==='face'?h*.60:h*1.95*Math.max(1,1/camera.aspect);camera.position.set(0,y,dist);controls.update()}function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();if(bounds)frame()}new ResizeObserver(resize).observe(view);resize();async function load(sex){const token=++seq;status.textContent='Loading '+sex+' model…';for(const id of ['male','female'])$(id).classList.toggle('active',id===sex.toLowerCase());try{const gltf=await loader.loadAsync('HairSample_'+sex+'.vrm');const next=gltf.userData.vrm;if(!next)throw Error('VRM missing');if(token!==seq){VRMUtils.deepDispose(next.scene);return}if(vrm){scene.remove(vrm.scene);vrm.scene.traverse(o=>{for(const m of (Array.isArray(o.material)?o.material:[o.material])){const r=m&&recolours.get(m);if(r){r.tex.dispose();m.map=r.original;if('shadeMultiplyTexture' in m)m.shadeMultiplyTexture=r.shade;recolours.delete(m)}}});VRMUtils.deepDispose(vrm.scene)}vrm=next;sexNow=sex;syncPose();VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);for(const [name,z] of [['leftUpperArm',sex==='Female'?1.08:1.30],['rightUpperArm',sex==='Female'?-1.08:-1.30]]){const b=vrm.humanoid.getNormalizedBoneNode(name);if(b)b.rotation.z=z}for(const side of ['left','right'])for(const finger of ['Index','Middle','Ring','Little'])for(const joint of ['Proximal','Intermediate','Distal']){const b=vrm.humanoid.getNormalizedBoneNode(side+finger+joint);if(b)b.rotation.z=(side==='left'?1:-1)*.10;}idle(0);vrm.update(0);bounds=new T.Box3().setFromObject(vrm.scene);vrm.scene.position.y-=bounds.min.y;bounds=new T.Box3().setFromObject(vrm.scene);appearance();frame();status.textContent=sex+' anime model loaded.'}catch(e){if(token===seq)status.textContent='Model load failed: '+e.message}}$('male').onclick=()=>load('Male');$('female').onclick=()=>load('Female');$('full').onclick=()=>{mode='full';frame()};$('face').onclick=()=>{mode='face';frame()};renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(vrm){const t=clock.elapsedTime;idle(t);vrm.expressionManager?.setValue('blink',Math.max(0,1-Math.abs(t%5-4.7)*12));vrm.update(dt)}controls.update();renderer.render(scene,camera)});load(saved?.sex==='Female'?'Female':'Male');</script></body></html>
