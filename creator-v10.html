<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ashen Realms V0.10.0</title><style>*{box-sizing:border-box}body{margin:0;background:#13101e;color:#eee;font:16px system-ui}header{text-align:center;padding:18px;letter-spacing:3px;color:#c7a9ff}#view{height:60dvh;min-height:280px;position:relative;touch-action:none}canvas{display:block}main{max-width:650px;margin:auto;padding:16px}button{background:#332647;color:white;border:1px solid #8065aa;border-radius:10px;padding:12px;flex:1;font:inherit}button.active{background:#67449d}.row{display:flex;gap:8px;margin-bottom:12px}#status{color:#c7a9ff}small{color:#b7adc8}</style><script type=importmap>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"}}</script></head><body><header>ASHEN REALMS · V0.10.0</header><div id=view></div><main><div class=row><button id=male>Male</button><button id=female>Female</button></div><div class=row><button id=full>Full body</button><button id=face>Face close-up</button></div><div id=status role=status>Loading renderer…</div><p><small>Anime asset preview · Drag to rotate, pinch to zoom. Body sculpting, equipment and saved characters are not connected yet.</small></p></main><script type=module>
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const $=id=>document.getElementById(id), view=$('view'), status=$('status');const scene=new T.Scene();scene.background=new T.Color(0x181324);const camera=new T.PerspectiveCamera(35,1,.01,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));view.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=.25;controls.maxDistance=8;scene.add(new T.HemisphereLight(0xffffff,0x74658e,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);const rim=new T.DirectionalLight(0xb79aff,1.5);rim.position.set(-3,2,-3);scene.add(rim);const floor=new T.Mesh(new T.CylinderGeometry(1,1,.05,64),new T.MeshStandardMaterial({color:0x39304c}));floor.position.y=-.025;scene.add(floor);const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));let vrm=null,bounds=null,seq=0,mode='full';const clock=new T.Clock();function frame(){if(!bounds)return;const h=bounds.max.y-bounds.min.y;const y=mode==='face'?bounds.max.y-h*.12:bounds.min.y+h*.5;controls.target.set(0,y,0);const dist=mode==='face'?h*.52:h*1.95*Math.max(1,1/camera.aspect);camera.position.set(0,y,dist);controls.update()}function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);resize();async function load(sex){const token=++seq;status.textContent='Loading '+sex+' model…';for(const id of ['male','female'])$(id).classList.toggle('active',id===sex.toLowerCase());try{const gltf=await loader.loadAsync('HairSample_'+sex+'.vrm');const next=gltf.userData.vrm;if(!next)throw Error('VRM missing');if(token!==seq){VRMUtils.deepDispose(next.scene);return}if(vrm){scene.remove(vrm.scene);VRMUtils.deepDispose(vrm.scene)}vrm=next;VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);for(const [name,z] of [['leftUpperArm',-1.12],['rightUpperArm',1.12]]){const b=vrm.humanoid.getNormalizedBoneNode(name);if(b)b.rotation.z=z}vrm.update(0);bounds=new T.Box3().setFromObject(vrm.scene);vrm.scene.position.y-=bounds.min.y;bounds=new T.Box3().setFromObject(vrm.scene);frame();status.textContent=sex+' anime model loaded.'}catch(e){if(token===seq)status.textContent='Model load failed: '+e.message}}$('male').onclick=()=>load('Male');$('female').onclick=()=>load('Female');$('full').onclick=()=>{mode='full';frame()};$('face').onclick=()=>{mode='face';frame()};renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(vrm){const t=clock.elapsedTime;const chest=vrm.humanoid.getNormalizedBoneNode('chest');if(chest)chest.rotation.x=Math.sin(t*1.6)*.008;vrm.expressionManager?.setValue('blink',Math.max(0,1-Math.abs(t%5-4.7)*12));vrm.update(dt)}controls.update();renderer.render(scene,camera)});load('Male');</script></body></html>
