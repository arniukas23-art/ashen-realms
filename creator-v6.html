<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ashen Realms | Character Creator</title><style>*{box-sizing:border-box}body{margin:0;background:#100e19;color:#eee;font:15px system-ui}header{padding:14px;text-align:center;letter-spacing:3px;color:#d1b1ff}main{display:grid;grid-template-columns:1fr 340px;max-width:1100px;margin:auto}#stage{height: min(75vh,700px);position:relative;background:#171222}canvas{display:block;touch-action:none}#status{position:absolute;top:10px;left:12px;pointer-events:none}aside{padding:16px;background:#1d1828}label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:12px}button,select,input{font:inherit;color:#eee;background:#30243f;border:1px solid #655080;border-radius:8px;padding:9px}input[type=range]{width:55%;accent-color:#ac83ed}input[type=color]{width:60px;padding:3px}button{cursor:pointer} .buttons{display:flex;gap:8px;flex-wrap:wrap}#save{background:#6744a0;width:100%;margin-top:12px}small{color:#b5a8c7} @media(max-width:700px){main{display:block}#stage{height:48vh;min-height:300px}aside{padding:12px}}</style><script type=importmap>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header>ASHEN REALMS · CREATE YOUR HUNTER</header><main><div id=stage><div id=status>Loading 3D assets…</div></div><aside><div class=buttons><button id=full>Full body</button><button id=face>Face close-up</button></div><label>Name<input id=hero maxlength=32 value="Hunter"></label><label>Body<select id=body><option>Male</option><option>Female</option></select></label><label>Hair<select id=hair><option value=Hair_SimpleParted>Parted</option><option value=Hair_Buzzed>Buzzed</option><option value=Hair_BuzzedFemale>Short</option><option value=Hair_Long>Long</option><option value=Hair_Buns>Buns</option><option value=None>Bald</option></select></label><label>Beard<input type=checkbox id=beard></label><label>Hair colour<input type=color id=hairColor value="#35251e"></label><label>Eye tint<input type=color id=eyeColor value="#ffffff"></label><label>Skin texture<select id=skin><option>Light</option><option>Dark</option></select></label><label>Height<input type=range id=height min=85 max=115 value=100></label><label>Build (width)<input type=range id=width min=85 max=115 value=100></label><div class=buttons><button id=random>Randomise</button><button id=reset>Reset</button></div><button id=save>Save hunter</button><p><small>Prototype · drag to rotate, pinch to zoom. Build uses overall scaling, not anatomical sculpting. Models: Quaternius, CC0.</small></p></aside></main><script type=module>
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage'),scene=new T.Scene();scene.background=new T.Color(0x171222);const camera=new T.PerspectiveCamera(35,1,.01,50);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=T.SRGBColorSpace;stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.minDistance=.35;controls.maxDistance=7;controls.enableDamping=true;scene.add(new T.HemisphereLight(0xe6dfff,0x62536b,2));for(const [x,y,z,c,i] of [[3,4,4,0xffe9db,3],[-3,2,-2,0xa486ff,4]]){const l=new T.DirectionalLight(c,i);l.position.set(x,y,z);scene.add(l)}const floor=new T.Mesh(new T.CylinderGeometry(1.25,1.35,.12,64),new T.MeshStandardMaterial({color:0x30283d,roughness:.8}));floor.position.y=-.08;scene.add(floor);const group=new T.Group();scene.add(group);const loader=new GLTFLoader(),tl=new T.TextureLoader(),cache=new Map();const load=n=>{if(!cache.has(n))cache.set(n,loader.loadAsync('creator-assets/'+n+'.gltf'));return cache.get(n)};const ids=['hero','body','hair','beard','hairColor','eyeColor','skin','height','width'];const defaults=Object.fromEntries(ids.map(k=>[k,k==='beard'?$(k).checked:$(k).value]));function state(){return Object.fromEntries(ids.map(k=>[k,k==='beard'?$(k).checked:$(k).value]))}function restore(s){for(const k of ids)if(s[k]!==undefined){if(k==='beard')$(k).checked=!!s[k];else $(k).value=s[k]}}try{restore(JSON.parse(localStorage.getItem('ashen-creator-v6')||'{}'))}catch{}let token=0;const textures=new Map();function tex(n){if(!textures.has(n)){const t=tl.load('creator-assets/'+n);t.colorSpace=T.SRGBColorSpace;t.flipY=false;textures.set(n,t)}return textures.get(n)}function view(face=false){controls.target.set(0,face?1.65:0.95,0);camera.position.set(0,face?1.65:1.05,face?.65:3.65);controls.update()}view();$('full').onclick=()=>view();$('face').onclick=()=>view(true);function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
async function update(){const t=++token,s=state();$('status').textContent='Loading…';try{const names=['Superhero_'+s.body+'_FullBody',...(s.hair==='None'?[]:[s.hair]),...(s.beard?['Hair_Beard']:[])];const models=await Promise.all(names.map(load));if(t!==token)return;group.clear();for(let i=0;i<models.length;i++){const obj=models[i].scene;group.add(obj);obj.traverse(m=>{if(!m.isMesh)return;for(const mat of Array.isArray(m.material)?m.material:[m.material]){if(/Hair/i.test(mat.name)){mat.color.set(s.hairColor);mat.map=null;}else if(/Eyes/i.test(mat.name)){mat.color.set(s.eyeColor)}else if(/Superhero/i.test(mat.name)){mat.map=tex(s.body==='Male'?(s.skin==='Light'?'T_Superhero_Male_Ligh.jpg':'T_Superhero_Male_Dark.jpg'):(s.skin==='Light'?'T_Superhero_Female_Light_BaseColor.jpg':'T_Superhero_Female_Dark_BaseColor.jpg'))}mat.needsUpdate=true;}});if(i>0){const femaleStyle=/Buns|Long|BuzzedFemale/.test(names[i]);obj.position.y=(s.body==='Male'&&femaleStyle)?.10:(s.body==='Female'&&!femaleStyle?-.10:0)}}group.scale.set(+s.width/100,+s.height/100,+s.width/100);$('status').textContent='Drag to rotate'}catch(e){if(t===token)$('status').textContent='Model load failed: '+e.message;console.error(e)}}for(const k of ids.filter(k=>k!=='hero'))$(k).addEventListener('input',update);$('reset').onclick=()=>{restore(defaults);update()};$('random').onclick=()=>{for(const k of ['body','hair','skin'])$(k).selectedIndex=Math.floor(Math.random()*$(k).options.length);$('hairColor').value='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');$('eyeColor').value='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');update()};$('save').onclick=()=>{try{localStorage.setItem('ashen-creator-v6',JSON.stringify(state()));$('status').textContent='Hunter saved on this device'}catch{$('status').textContent='Saving unavailable'}};update();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
