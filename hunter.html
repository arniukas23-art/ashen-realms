
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashen Realms - Shadow Hunter</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080911;color:#eee7ff;
 font-family:system-ui,sans-serif;
}
header{text-align:center;padding:18px}
h1{
 color:#bc94ff;font: bold 27px Georgia;
 letter-spacing:5px;margin:0
}
small{color:#a99bbd}
#scene{height:58dvh;min-height:280px}
canvas{display:block;touch-action:none}
#status{
 text-align:center;padding:12px;color:#bd9aff
}
.controls{display:flex;gap:8px;padding:12px}
button{
 flex:1;padding:14px 8px;color:white;
 background:#30204c;border:1px solid #8462b5;
 border-radius:8px;font-size:13px
}
</style>
<script type="importmap">
{
 "imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
 "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
 }
}
</script>
</head>
<body>
<header>
<h1>ASHEN REALMS</h1>
<small>SHADOW HUNTER - CHARACTER TEST</small>
</header>
<div id="scene"></div>
<div id="status">Summoning hunter...</div>
<div class="controls">
<button id="idle">Idle</button>
<button id="shadow">Shadow aura</button>
<button id="rotate">Rotate</button>
<button id="reset">Reset view</button>
</div>
<script type="module">
const status=document.getElementById('status');
try{
const T=await import('three');
const {GLTFLoader}=await import(
 'three/addons/loaders/GLTFLoader.js'
);
const {OrbitControls}=await import(
 'three/addons/controls/OrbitControls.js'
);
const {VRMLoaderPlugin,VRMUtils}=await import(
 '@pixiv/three-vrm'
);
const host=document.getElementById('scene');
const scene=new T.Scene();
scene.background=new T.Color(0x100d1b);
scene.fog=new T.FogExp2(0x100d1b,0.07);

const camera=new T.PerspectiveCamera(
 34,host.clientWidth/host.clientHeight,
 0.01,100
);
camera.position.set(0,1.25,3.8);

const renderer=new T.WebGLRenderer({
 antialias:true
});
renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);
renderer.setSize(
 host.clientWidth,host.clientHeight
);
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(
 camera,renderer.domElement
);
controls.target.set(0,0.95,0);
controls.enableDamping=true;
controls.minDistance=1.5;
controls.maxDistance=7;
controls.update();
controls.saveState();

scene.add(new T.HemisphereLight(
 0xe1d5ff,0x343047,2
));
const key=new T.DirectionalLight(
 0xffffff,3
);
key.position.set(3,5,4);
scene.add(key);

const rim=new T.PointLight(
 0x9944ff,12,8
);
rim.position.set(-1,1.5,-1);
scene.add(rim);

const floor=new T.Mesh(
 new T.CircleGeometry(6,96),
 new T.MeshStandardMaterial({
 color:0x171323,roughness:.8
 })
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

for(const radius of [.8,1,1.05]){
 const ring=new T.Mesh(
 new T.RingGeometry(
 radius,radius+.008,96
 ),
 new T.MeshBasicMaterial({
 color:0x9864ff,side:T.DoubleSide
 })
 );
 ring.rotation.x=-Math.PI/2;
 ring.position.y=.005;
 scene.add(ring);
}

const count=180;
const positions=new Float32Array(count*3);
const geometry=new T.BufferGeometry();
geometry.setAttribute(
 'position',new T.BufferAttribute(positions,3)
);
const particles=new T.Points(
 geometry,
 new T.PointsMaterial({
 color:0xb477ff,size:.018,
 transparent:true,opacity:.8,
 blending:T.AdditiveBlending,
 depthWrite:false
 })
);
scene.add(particles);
particles.visible=false;

let vrm;
let aura=false;
let idle=true;
const loader=new GLTFLoader();
loader.register(parser=>new VRMLoaderPlugin(parser));

status.textContent='Loading textured anime model...';

loader.load(
 'https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/HairSample_Male.vrm',
 gltf=>{
 vrm=gltf.userData.vrm;
 if(!vrm){
 status.textContent='VRM model unavailable';
 return;
 }
 VRMUtils.rotateVRM0(vrm);
 scene.add(vrm.scene);
 vrm.scene.traverse(o=>o.frustumCulled=false);
 status.textContent='Shadow Hunter - model loaded';
 },
 undefined,
 error=>{
 status.textContent='Model loading failed';
 console.error(error);
 }
);

document.getElementById('shadow').onclick=()=>{
 aura=!aura;
 particles.visible=aura;
 rim.intensity=aura?35:12;
};
document.getElementById('idle').onclick=()=>{
 idle=!idle;
};
document.getElementById('rotate').onclick=()=>{
 controls.autoRotate=!controls.autoRotate;
};
document.getElementById('reset').onclick=()=>{
 controls.autoRotate=false;
 controls.reset();
};

const clock=new T.Clock();
let time=0;
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);
 time+=dt;
 if(vrm){
 const h=vrm.humanoid;
 for(const side of ['left','right']){
 const arm=h.getNormalizedBoneNode(
 side+'UpperArm'
 );
 if(arm)arm.rotation.z=
 (side==='left'?1:-1)*1.25;
 }
 const chest=h.getNormalizedBoneNode('chest');
 if(chest)chest.rotation.x=
 idle?Math.sin(time*2)*.015:0;
 const head=h.getNormalizedBoneNode('head');
 if(head)head.rotation.y=
 idle?Math.sin(time*.8)*.06:0;
 vrm.update(dt);
 }
 if(aura){
 for(let i=0;i<count;i++){
 const a=i*2.399+time*.8;
 const r=.35+(i%11)*.045;
 positions[i*3]=Math.cos(a)*r;
 positions[i*3+1]=
 ((i*.137+time*.3)%1)*1.9;
 positions[i*3+2]=Math.sin(a)*r;
 }
 geometry.attributes.position.needsUpdate=true;
 }
 controls.update();
 renderer.render(scene,camera);
});

new ResizeObserver(()=>{
 camera.aspect=host.clientWidth/host.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(
 host.clientWidth,host.clientHeight
 );
}).observe(host);

}catch(error){
 status.textContent='Engine error: '+error.message;
}
</script>
</body>
</html>
