<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashen Realms — Equipment Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b15;color:#eee8ff;font:14px system-ui}main{max-width:800px;margin:auto}header{padding:16px;display:flex;justify-content:space-between;align-items:center}h1{font: bold 23px Georgia;letter-spacing:2px;color:#c9a5ff;margin:0}#scene{height:43dvh;min-height:240px;max-height:480px}canvas{display:block;touch-action:none}.panel{padding:12px;border-top:1px solid #392b50}button{background:#302047;color:white;border:1px solid #7456a0;border-radius:8px;padding:12px;cursor:pointer}button:disabled{opacity:.4}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row button{flex:1}#enhance{width:100%;background:#6136a0;font-weight:bold;margin-top:8px}small,#status{color:#b9a6d5}#status{padding:6px 12px;font-size:12px}#items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.selected{border-color:#d5aaff;background:#503377}h2{font-size:17px;margin:5px 0}p{margin:6px 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"}}</script><main><header><h1>ASHEN REALMS · 0.4</h1><span id="gold"></span></header><div id="scene"></div><div id="status">Loading hunter…</div><section class="panel"><div class="row"><h2 id="name"></h2><strong id="attack"></strong></div><small id="next"></small><button id="enhance">Enhance +1</button><div class="row" style="margin-top:8px"><button id="aura">Shadow aura</button><button id="rotate">Rotate</button><button id="reset">Reset camera</button></div></section><section class="panel"><h2>Weapon inventory</h2><div id="items"></div><p><small>Prototype weapons · all three unlocked const $=id=>document.getElementById(id);let gold=2000,selected=0,levels=[0,0,0],aura=true,refreshWeapon=()=>{},flash=()=>{},focusWeapon=()=>{};const items=[{name:'Shadowfang',atk:24,color:0x9966ff,len:.43},{name:'Frost Reaver',atk:32,color:0x55ccff,len:.62},{name:'Blood Oath',atk:40,color:0xff3355,len:.76}];const saveKey='ashen-realms-studio-v4';try{const v=JSON.parse(localStorage.getItem(saveKey));if(v&&Number.isInteger(v.gold)&&v.gold>=0&&Array.isArray(v.levels)&&v.levels.length===3&&v.levels.every(x=>Number.isInteger(x)&&x>=0&&x<=20)&&[0,1,2].includes(v.selected)){gold=v.gold;levels=v.levels;selected=v.selected}}catch{}function save(){try{localStorage.setItem(saveKey,JSON.stringify({gold,levels,selected}));$('saveStatus').textContent='Progress saved on this browser'}catch{$('saveStatus').textContent='Browser storage unavailable'}}function ui(){let w=items[selected],l=levels[selected],cost=15+l*5;$('gold').textContent=gold+' G';$('name').textContent=w.name+' +'+l;$('attack').textContent=(w.atk+l*3)+' ATK';$('next').textContent=l===20?'Maximum enhancement':`Next: ${w.atk+(l+1)*3} ATK · ${cost} gold`;$('enhance').disabled=l===20||gold<cost;$('enhance').textContent=l===20?'Maximum level':'Enhance to +'+(l+1);$('items').replaceChildren(...items.map((w,i)=>{let b=document.createElement('button');b.textContent=w.name+' +'+levels[i];b.className=i===selected?'selected':'';b.onclick=()=>{selected=i;ui();refreshWeapon();save();focusWeapon()};return b}))}ui();$('enhance').onclick=()=>{let l=levels[selected],cost=15+l*5;if(l>=20||gold<cost)return;gold-=cost;levels[selected]++;ui();refreshWeapon();flash();save()};
try{const T=await import('three');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');const {VRMLoaderPlugin,VRMUtils}=await import('@pixiv/three-vrm');const host=$('scene'),scene=new T.Scene();scene.background=new T.Color(0x100d1b);scene.fog=new T.FogExp2(0x100d1b,.09);const camera=new T.PerspectiveCamera(35,host.clientWidth/host.clientHeight,.01,100);camera.position.set(0,1.15,3.5);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(host.clientWidth,host.clientHeight);renderer.toneMapping=T.ACESFilmicToneMapping;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;controls.minDistance=1.5;controls.maxDistance=7;controls.update();controls.saveState();scene.add(new T.HemisphereLight(0xe1d5ff,0x343047,1.5));const key=new T.DirectionalLight(0xffffff,2);key.position.set(3,5,4);scene.add(key);const rim=new T.PointLight(0x9944ff,15,8);rim.position.set(-1,1.5,-1);scene.add(rim);const floor=new T.Mesh(new T.CircleGeometry(6,96),new T.MeshStandardMaterial({color:0x171323,roughness:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);const stone=document.createElement('canvas');stone.width=stone.height=512;const sc=stone.getContext('2d');sc.fillStyle='#171620';sc.fillRect(0,0,512,512);let seed=31;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let y=0;y<8;y++)for(let x=-1;x<8;x++){const px=x*64+(y%2)*32,py=y*64;sc.fillStyle=`rgb(${30+rand()*18|0},${29+rand()*15|0},${39+rand()*17|0})`;sc.fillRect(px+2,py+2,60,60)}for(let i=0;i<18000;i++){sc.fillStyle=rand()>.5?'#ffffff0b':'#00000020';sc.fillRect(rand()*512,rand()*512,2,1)}const tex=new T.CanvasTexture(stone);tex.colorSpace=T.SRGBColorSpace;tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(5,5);floor.material.map=tex;floor.materia let vrm,weapon,burst=0,focus=false;const handPos=new T.Vector3(),direction=new T.Vector3(),up=new T.Vector3(0,1,0);focusWeapon=()=>{controls.autoRotate=false;focus=true};let dummy=0;const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));refreshWeapon=()=>{if(!vrm)return;if(weapon){weapon.removeFromParent();weapon.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}})}let hand=vrm.humanoid.getRawBoneNode('rightHand');if(!hand)return;let w=items[selected],l=levels[selected];weapon=new T.Group();let shape=new T.Shape();shape.moveTo(-.035,0);shape.lineTo(-.045,w.len*.7);shape.lineTo(0,w.len);shape.lineTo(.045,w.len*.7);shape.lineTo(.035,0);shape.closePath();let blade=new T.Mesh(new T.ExtrudeGeometry(shape,{depth:.012,bevelEnabled:true,bevelSize:.006,bevelThickness:.004,bevelSegments:1,steps:1}),new T.MeshStandardMaterial({color:0x55576a,metalness:.85,roughness:.28,emissive:w.color,emissiveIntensity:.12+l*.07}));weapon.add(blade);let grip=new T.Mesh(new T.CylinderGeometry(.019,.019,.12,12),new T.MeshStandardMaterial({color:0x15131c}));grip.position.y=-.06;weapon.add(grip);let guard=new T.Mesh(new T.BoxGeometry(.15,.025,.045),new T.MeshStandardMaterial({color:0x777184,metalness:.8,roughness:.3}));weapon.add(guard);const tier=Math.floor(l/5);for(let j=0;j<tier;j++){const y=w.len*(.18+j*.15);for(const sign of [-1,1]){const spike=new T.Mesh(new T.ConeGeometry(.025+j*.004,.13+j*.025,4),new T.MeshStandardMaterial({color:0x353044,metalness:.85,roughness:.25,emissive:w.color,emissiveIntensity:.3+tier*.2}));spike.position.set(sign*.045,y,0);spike.rotation.z=-sign*.95;weapon.add(spike)}}if(tier){const core=new T.Mesh(new T.OctahedronGeometry(.028+tier*.009),new T.MeshStandardMaterial({color:w.color,emissive:w.color,emissiveIntensity:1+tier*.3}));core.position.y=.035;weapon.add(core)}scene.add(weapon);};loader.load('https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/HairSample_Male.vrm',gltf=>{vrm=gltf.userData.vrm;if(!vrm){$('s .65,-.65,.38).normalize();weapon.quaternion.setFromUnitVectors(up,direction);weapon.position.copy(handPos).addScaledVector(direction,.06);if(focus){camera.position.lerp(new T.Vector3(-1.15,1.15,2.9),.09);controls.target.lerp(new T.Vector3(-.12,.85,0),.09);if(camera.position.distanceTo(new T.Vector3(-1.15,1.15,2.9))<.025)focus=false}}}}particles.visible=aura||burst>0;rim.intensity=15+burst*45;for(let i=0;i<n;i++){let a=i*2.399+t*(.8+burst*3),r=.35+(i%11)*.045+burst*.35;positions[i*3]=Math.cos(a)*r;positions[i*3+1]=((i*.137+t*.3)%1)*1.9;positions[i*3+2]=Math.sin(a)*r}geo.attributes.position.needsUpdate=true;controls.update();renderer.render(scene,camera)});new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host)}catch(e){$('status').textContent='Engine error: '+e.message}
