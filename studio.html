<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashen Realms — Equipment Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b15;color:#eee8ff;font:14px system-ui}main{max-width:800px;margin:auto}header{padding:16px;display:flex;justify-content:space-between;align-items:center}h1{font: bold 23px Georgia;letter-spacing:2px;color:#c9a5ff;margin:0}#scene{height:43dvh;min-height:240px;max-height:480px}canvas{display:block;touch-action:none}.panel{padding:12px;border-top:1px solid #392b50}button{background:#302047;color:white;border:1px solid #7456a0;border-radius:8px;padding:12px;cursor:pointer}button:disabled{opacity:.4}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row button{flex:1}#enhance{width:100%;background:#6136a0;font-weight:bold;margin-top:8px}small,#status{color:#b9a6d5}#status{padding:6px 12px;font-size:12px}#items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.selected{border-color:#d5aaff;background:#503377}h2{font-size:17px;margin:5px 0}p{margin:6px 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"}}</script><main><header><h1>ASHEN REALMS</h1><span id="gold"></span></header><div id="scene"></div><div id="status">Loading hunter…</div><section class="panel"><div class="row"><h2 id="name"></h2><strong id="attack"></strong></div><small id="next"></small><button id="enhance">Enhance +1</button><div class="row" style="margin-top:8px"><button id="aura">Shadow aura</button><button id="rotate">Rotate</button><button id="reset">Reset camera</button></div></section><section class="panel"><h2>Weapon inventory</h2><div id="items"></div><p><small>Prototype weapons · all three unlocked for testing</small></p></section></main><script type="module">
const $=id=>document.getElementById(id);let gold=2000,selected=0,levels=[0,0,0],aura=true,refreshWeapon=()=>{},flash=()=>{};const items=[{name:'Shadowfang',atk:24,color:0x9966ff,len:.43},{name:'Frost Reaver',atk:32,color:0x55ccff,len:.62},{name:'Blood Oath',atk:40,color:0xff3355,len:.76}];function ui(){let w=items[selected],l=levels[selected],cost=15+l*5;$('gold').textContent=gold+' G';$('name').textContent=w.name+' +'+l;$('attack').textContent=(w.atk+l*3)+' ATK';$('next').textContent=l===20?'Maximum enhancement':`Next: ${w.atk+(l+1)*3} ATK · ${cost} gold`;$('enhance').disabled=l===20||gold<cost;$('enhance').textContent=l===20?'Maximum level':'Enhance to +'+(l+1);$('items').replaceChildren(...items.map((w,i)=>{let b=document.createElement('button');b.textContent=w.name+' +'+levels[i];b.className=i===selected?'selected':'';b.onclick=()=>{selected=i;ui();refreshWeapon()};return b}))}ui();$('enhance').onclick=()=>{let l=levels[selected],cost=15+l*5;if(l>=20||gold<cost)return;gold-=cost;levels[selected]++;ui();refreshWeapon();flash()};
try{const T=await import('three');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');const {VRMLoaderPlugin,VRMUtils}=await import('@pixiv/three-vrm');const host=$('scene'),scene=new T.Scene();scene.background=new T.Color(0x100d1b);scene.fog=new T.FogExp2(0x100d1b,.09);const camera=new T.PerspectiveCamera(35,host.clientWidth/host.clientHeight,.01,100);camera.position.set(0,1.15,3.5);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(host.clientWidth,host.clientHeight);renderer.toneMapping=T.ACESFilmicToneMapping;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;controls.minDistance=1.5;controls.maxDistance=7;controls.update();controls.saveState();scene.add(new T.HemisphereLight(0xe1d5ff,0x343047,1.5));const key=new T.DirectionalLight(0xffffff,2);key.position.set(3,5,4);scene.add(key);const rim=new T.PointLight(0x9944ff,15,8);rim.position.set(-1,1.5,-1);scene.add(rim);const floor=new T.Mesh(new T.CircleGeometry(6,96),new T.MeshStandardMaterial({color:0x171323,roughness:.8}));floor.rotation.x=-Math.PI/2;scene.add(floor);for(const r of [.8,1,1.05]){const ring=new T.Mesh(new T.RingGeometry(r,r+.008,96),new T.MeshBasicMaterial({color:0x9864ff,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.005;scene.add(ring)}const cv=document.createElement('canvas');cv.width=cv.height=128;const ctx=cv.getContext('2d'),g=ctx.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(0,0,0,.7)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,128,128);const shadow=new T.Mesh(new T.PlaneGeometry(1.2,1.2),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.009;scene.add(shadow);
let vrm,weapon,burst=0;const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));refreshWeapon=()=>{if(!vrm)return;if(weapon){weapon.removeFromParent();weapon.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}})}let hand=vrm.humanoid.getRawBoneNode('rightHand');if(!hand)return;let w=items[selected],l=levels[selected];weapon=new T.Group();let shape=new T.Shape();shape.moveTo(-.035,0);shape.lineTo(-.045,w.len*.7);shape.lineTo(0,w.len);shape.lineTo(.045,w.len*.7);shape.lineTo(.035,0);shape.closePath();let blade=new T.Mesh(new T.ExtrudeGeometry(shape,{depth:.012,bevelEnabled:true,bevelSize:.006,bevelThickness:.004,bevelSegments:1,steps:1}),new T.MeshStandardMaterial({color:0x55576a,metalness:.85,roughness:.28,emissive:w.color,emissiveIntensity:.12+l*.07}));weapon.add(blade);let grip=new T.Mesh(new T.CylinderGeometry(.019,.019,.12,12),new T.MeshStandardMaterial({color:0x15131c}));grip.position.y=-.06;weapon.add(grip);let guard=new T.Mesh(new T.BoxGeometry(.15,.025,.045),new T.MeshStandardMaterial({color:0x777184,metalness:.8,roughness:.3}));weapon.add(guard);weapon.rotation.z=Math.PI/2;hand.add(weapon);};loader.load('https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/HairSample_Male.vrm',gltf=>{vrm=gltf.userData.vrm;if(!vrm){$('status').textContent='VRM unavailable';return}VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);let changed=0;const seen=new Set();vrm.scene.traverse(o=>{o.frustumCulled=false;if(o.isMesh)for(const m of [].concat(o.material)){if(!m||seen.has(m))continue;seen.add(m);if(/cloth|hoodie|tops|wear/i.test(m.name||'')){if(m.color)m.color.multiplyScalar(.25);if(m.shadeColorFactor)m.shadeColorFactor.multiplyScalar(.4);changed++}}});refreshWeapon();$('status').textContent='Hunter ready · '+(changed?'dark material tint applied':'original outfit retained (material names unmatched)')},undefined,()=>{$('status').textContent='Model download failed'});const n=220,positions=new Float32Array(n*3),geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(positions,3));const particles=new T.Points(geo,new T.PointsMaterial({color:0xb477ff,size:.018,transparent:true,opacity:.8,blending:T.AdditiveBlending,depthWrite:false}));scene.add(particles);flash=()=>{burst=1};$('aura').onclick=()=>aura=!aura;$('rotate').onclick=()=>controls.autoRotate=!controls.autoRotate;$('reset').onclick=()=>{controls.autoRotate=false;controls.reset()};const clock=new T.Clock();let t=0;renderer.setAnimationLoop(()=>{let dt=Math.min(clock.getDelta(),.05);t+=dt;burst=Math.max(0,burst-dt);if(vrm){let h=vrm.humanoid;for(const side of ['left','right']){let arm=h.getNormalizedBoneNode(side+'UpperArm');if(arm)arm.rotation.z=(side==='left'?1:-1)*(1.25+Math.sin(t*1.6)*.025)}let chest=h.getNormalizedBoneNode('chest');if(chest)chest.rotation.x=Math.sin(t*2)*.012;vrm.update(dt)}particles.visible=aura||burst>0;rim.intensity=15+burst*45;for(let i=0;i<n;i++){let a=i*2.399+t*(.8+burst*3),r=.35+(i%11)*.045+burst*.35;positions[i*3]=Math.cos(a)*r;positions[i*3+1]=((i*.137+t*.3)%1)*1.9;positions[i*3+2]=Math.sin(a)*r}geo.attributes.position.needsUpdate=true;controls.update();renderer.render(scene,camera)});new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host)}catch(e){$('status').textContent='Engine error: '+e.message}
</script></html>
